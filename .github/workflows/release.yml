name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag matching package.json, e.g. v0.3.0'
        required: true
        type: string
      publish:
        description: 'Publish only after every macOS and Linux asset passes validation'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate version and refuse published release changes
        id: version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          const tag = process.env.RELEASE_TAG
          if (!/^\d+\.\d+\.\d+$/.test(version) || tag !== `v${version}`) throw new Error('Tag must equal the stable package version')
          const tagged = execFileSync('git', ['rev-parse', '--verify', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' }).trim()
          if (tagged !== execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()) throw new Error('Checkout must match the tag commit')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\n`)
          NODE
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/inkleaf-release.json" 2> "$RUNNER_TEMP/inkleaf-release-error.txt"; then
            node --input-type=module -e 'import fs from "node:fs"; if (!JSON.parse(fs.readFileSync(process.argv[1])).isDraft) throw new Error("Published releases cannot be overwritten; use a new version")' "$RUNNER_TEMP/inkleaf-release.json"
          elif ! grep -qi 'release not found' "$RUNNER_TEMP/inkleaf-release-error.txt"; then
            cat "$RUNNER_TEMP/inkleaf-release-error.txt" >&2
            exit 1
          fi

  mac:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:updates
      - run: npm run test:platform
      - run: npm run release:build -- --arch arm64
      - name: Verify macOS archive
        run: |
          cd dist
          shasum -a 256 -c "Inkleaf-${VERSION}-mac-arm64.zip.sha256"
          unzip -l "Inkleaf-${VERSION}-mac-arm64.zip" | grep 'Inkleaf.app/Contents/Info.plist'
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Inkleaf-*-mac-arm64.zip
            dist/Inkleaf-*-mac-arm64.zip.sha256

  linux:
    needs: validate
    uses: ./.github/workflows/linux.yml
    with:
      ref: ${{ needs.validate.outputs.tag }}

  publish:
    needs: [validate, mac, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: release-assets
      - name: Verify every asset and upload one complete draft
        run: node scripts/publish-release.mjs release-assets
